name: Deploy Apex Unified — Dry-Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: deploy-dry-run'
        required: true

jobs:
  safety-check:
    name: Pre-flight safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-ao4nr

      - name: Confirm correct branch and commits
        run: |
          echo "Branch: $(git branch --show-current 2>/dev/null || echo 'claude/new-session-ao4nr')"
          echo "Recent commits:"
          git log --oneline -5
          echo "---"
          # Verify Atlas extractions are present
          git log --oneline | grep -q "Atlas\|audit\|DRY_RUN\|loan floor" || true

      - name: Mainnet execution guard
        run: |
          echo "Scanning for live execution flags..."
          # Must not find DRY_RUN=false anywhere in source
          if grep -r "DRY_RUN=false\|ARB_DRY_RUN=false" \
            --include="*.ts" --include="*.go" --include="*.yml" \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "FATAL: live execution flag found in source. Stopping."
            exit 1
          fi
          echo "DRY_RUN guard: PASSED"

      - name: Confirm deploy input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-dry-run" ]; then
            echo "Confirmation text did not match. Type exactly: deploy-dry-run"
            exit 1
          fi
          echo "Confirmation: OK"

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: safety-check
    steps:
      - name: Block A — System dependencies
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 300s
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get upgrade -y -qq
            apt-get install -y -qq git curl screen build-essential
            echo "Node check: $(node --version 2>/dev/null || echo 'not installed')"

      - name: Block B — Node 22
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 120s
          script: |
            set -e
            if ! node --version 2>/dev/null | grep -q "v22"; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"

      - name: Block C — Go 1.24
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 120s
          script: |
            set -e
            if ! /usr/local/go/bin/go version 2>/dev/null; then
              wget -q https://go.dev/dl/go1.24.7.linux-amd64.tar.gz -O /tmp/go.tar.gz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tar.gz
              rm /tmp/go.tar.gz
              echo 'export PATH=$PATH:/usr/local/go/bin' >> /root/.bashrc
            fi
            export PATH=$PATH:/usr/local/go/bin
            echo "Go: $(go version)"

      - name: Block D — Clone repo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 60s
          script: |
            set -e
            if [ -d /opt/apex/.git ]; then
              cd /opt/apex
              git fetch origin claude/new-session-ao4nr
              git checkout claude/new-session-ao4nr
              git pull origin claude/new-session-ao4nr
              echo "Repo updated"
            else
              rm -rf /opt/apex
              git clone --branch claude/new-session-ao4nr \
                https://github.com/ivoryrose1984-maker/easycb-go.git /opt/apex
            fi
            cd /opt/apex
            echo "Commits on server:"
            git log --oneline -5

      - name: Block E — Build apex-unified
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 300s
          script: |
            set -e
            cd /opt/apex/apex-unified
            npm install --silent
            npm run build
            echo "apex-unified build: OK"
            ls -la dist/scripts/dry-run.js

      - name: Block G — Write env file
        uses: appleboy/ssh-action@v1.2.0
        env:
          ALCHEMY_WSS_URL: ${{ secrets.ALCHEMY_WSS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          envs: ALCHEMY_WSS_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          command_timeout: 30s
          script: |
            set -e
            # apex-unified .env — dry run, no private key needed
            cat > /opt/apex/apex-unified/.env << ENVEOF
            BOT_ID=apex-unified
            DRY_RUN=true
            ALLOW_LIVE=false
            NETWORK=base
            CHAIN_ID=8453
            ALCHEMY_WSS_URL=${ALCHEMY_WSS_URL}
            ENABLE_DEX_SPREAD_SIGNAL=true
            ENABLE_TRIANGULAR_SIGNAL=true
            ENABLE_CBETH_SIGNAL=true
            ENABLE_CEX_CONTEXT=true
            ENABLE_FLASH_LOAN_PLANNER=false
            ENABLE_BUILDER_SUBMISSION=false
            MAX_TRADE_USD=50000
            MAX_DAILY_LOSS_USD=500
            MIN_NET_EDGE_BPS=5
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
            ENVEOF

            # Verify safety flags — must be true
            grep "DRY_RUN=true" /opt/apex/apex-unified/.env
            grep "ALLOW_LIVE=false" /opt/apex/apex-unified/.env
            echo "Env write: OK"

      - name: Block H — Start apex-unified in screen session
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 60s
          script: |
            set -e
            mkdir -p /var/log/apex /opt/apex/apex-unified/logs

            # Kill existing session if any
            screen -S apex-unified -X quit 2>/dev/null || true
            sleep 2

            # Start apex-unified dry-run
            screen -dmS apex-unified bash -c \
              'cd /opt/apex/apex-unified && node dist/scripts/dry-run.js 2>&1 | tee /var/log/apex/unified.log'

            sleep 3
            echo "Running sessions:"
            screen -ls

      - name: Block I — Verify logs (wait 20s)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 60s
          script: |
            sleep 20
            echo "=== APEX UNIFIED LOGS ==="
            tail -40 /var/log/apex/unified.log 2>/dev/null || echo "No log yet"
            echo ""
            # Fail if bot crashed immediately
            if ! screen -ls | grep -q "apex-unified"; then
              echo "FATAL: apex-unified screen session not running"
              cat /var/log/apex/unified.log
              exit 1
            fi
            echo "apex-unified running"

      - name: Block J — Auto-restart on reboot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 30s
          script: |
            cat > /opt/restart-apex-unified.sh << 'SCRIPT'
            #!/bin/bash
            sleep 10
            mkdir -p /var/log/apex /opt/apex/apex-unified/logs
            screen -dmS apex-unified bash -c \
              'cd /opt/apex/apex-unified && node dist/scripts/dry-run.js 2>&1 | tee /var/log/apex/unified.log'
            SCRIPT
            chmod +x /opt/restart-apex-unified.sh

            # Add to crontab if not already there
            (crontab -l 2>/dev/null | grep -v restart-apex-unified; echo "@reboot /opt/restart-apex-unified.sh") | crontab -
            echo "Crontab:"
            crontab -l

  verify-supabase:
    name: Supabase data check (10 min after deploy)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait 10 minutes
        run: sleep 600

      - name: Check logs and JSONL output
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.161.113.63
          username: root
          password: ${{ secrets.HETZNER_ROOT_PASSWORD }}
          command_timeout: 30s
          script: |
            echo "=== Final log check ==="
            tail -60 /var/log/apex/unified.log
            echo ""
            echo "=== JSONL opportunity count ==="
            find /opt/apex/apex-unified/logs -name "opportunities-*.jsonl" \
              -exec wc -l {} \; 2>/dev/null || echo "No JSONL files yet (normal if <1 block)"
