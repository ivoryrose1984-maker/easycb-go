name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd apex-predator && npm ci
      - run: cd apex-predator && npm run build
      - run: cd apex-predator && npm test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd arbitrage && go build ./...
      - run: cd arbitrage && go vet ./...
      - run: cd arbitrage && go test ./...

  lint-solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install solc 0.8.19
        run: |
          pip install solc-select --quiet
          solc-select install 0.8.19
          solc-select use 0.8.19
      - name: Compile contracts
        run: |
          solc --bin arbitrage/contracts/FlashLoan.sol
          solc --bin apex-predator/contracts/ApexFlashLoan.sol
          echo "Contracts compiled ✅"
